<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-accent="emerald">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>فیت‌شاه | PWA کالری‌شمار و فستینگ</title>
<meta name="theme-color" content="#10b981">

<!-- Manifest -->
<link rel="manifest" href="data:application/json,{
  &quot;name&quot;:&quot;FitShah&quot;,
  &quot;short_name&quot;:&quot;FitShah&quot;,
  &quot;lang&quot;:&quot;fa&quot;,
  &quot;dir&quot;:&quot;rtl&quot;,
  &quot;start_url&quot;:&quot;/index.html&quot;,
  &quot;display&quot;:&quot;standalone&quot;,
  &quot;background_color&quot;:&quot;#05080f&quot;,
  &quot;theme_color&quot;:&quot;#10b981&quot;,
  &quot;orientation&quot;:&quot;portrait&quot;,
  &quot;icons&quot;:[
    {&quot;src&quot;:&quot;icon-192.png&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/png&quot;},
    {&quot;src&quot;:&quot;icon-512.png&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/png&quot;}
  ]
}">

<style>
/* ---------- BASE ---------- */
@font-face{
  font-family:Vazirmatn;
  src:url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn/Vazirmatn.woff2') format('woff2');
  font-weight:100 900;
  font-display:swap;
}

:root{
  --bg:#05080f;
  --card:#0f172a;
  --elev:#1e293b;
  --txt:#f8fafc;
  --mut:#94a3b8;
  --bd:rgba(255,255,255,.08);
  --em:#10b981;
  --em2:#0d9488;
  --glow:rgba(16,185,129,.25);
  --gold:#fbbf24;
}

body{
  background:var(--bg);
  color:var(--txt);
  font-family:Vazirmatn,Tahoma,sans-serif;
  margin:0;
  padding:0;
}

/* ---------- LAYOUT ---------- */
.topnav{
  height:64px;
  background:rgba(11,18,32,.92);
  border-bottom:1px solid var(--bd);
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 20px;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:24px 20px 60px;
}

.grid-4{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

/* ---------- COMPONENTS ---------- */
.kpi{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:18px;
}

.kpi__label{
  font-size:.75rem;
  color:var(--mut);
  font-weight:700;
}

.kpi__value{
  font-size:1.8rem;
  font-weight:900;
  direction:ltr;
}

.kpi__sub{
  font-size:.72rem;
  color:var(--mut);
  margin-top:6px;
}

.kpi--green{color:var(--em)}
.kpi--gold{color:var(--gold)}

.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:20px;
  margin-top:20px;
}

.btn{
  padding:13px 18px;
  border-radius:10px;
  font-weight:900;
  border:none;
  cursor:pointer;
}

.btn-primary{
  background:linear-gradient(90deg,var(--em),var(--em2));
  color:#05080f;
}

/* ---------- MOBILE ---------- */
@media(max-width:480px){
  *{transition:none !important;}
}
</style>

</head>
<body>

<nav class="topnav">
  <button class="brand" style="background:none;border:none;color:var(--txt);display:flex;align-items:center;gap:10px;">
    <div class="b-logo" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--em),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:900;">FS</div>
    <div class="brand-text">
      <b style="font-size:1rem;">فیت‌شاه</b>
      <span style="font-size:.7rem;color:var(--mut);font-weight:600;">کالری‌شمار و فستینگ</span>
    </div>
  </button>
</nav>

<div class="wrap">

  <div class="grid-4">
    <div class="kpi kpi--green">
      <div class="kpi__label">کالری امروز</div>
      <div class="kpi__value">1240</div>
      <div class="kpi__sub">هدف: 1800</div>
    </div>

    <div class="kpi kpi--gold">
      <div class="kpi__label">فستینگ</div>
      <div class="kpi__value">16:45</div>
      <div class="kpi__sub">در حال انجام</div>
    </div>
  </div>

  <div class="card">
    <div class="ch" style="font-weight:900;margin-bottom:10px;">اطلاعات روز</div>
    <p class="csub" style="color:var(--mut);font-size:.85rem;line-height:1.8;">
      این بخش شامل خلاصهٔ کالری، فستینگ و فعالیت روزانه است.
    </p>
    <button class="btn btn-primary">شروع فستینگ</button>
  </div>

</div>

<!-- ---------- SERVICE WORKER INLINE ---------- -->
<script>
const swCode = `
const CACHE_NAME = "fitshah-v1";
const ASSETS = [
  "/",
  "/index.html"
];

self.addEventListener("install", e => {
  e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS)));
});

self.addEventListener("activate", e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
    )
  );
});

self.addEventListener("fetch", e => {
  e.respondWith(
    caches.match(e.request).then(res => res || fetch(e.request))
  );
});
`;

const blob = new Blob([swCode], {type:"application/javascript"});
const swURL = URL.createObjectURL(blob);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register(swURL);
}
</script>

</body>
</html>
