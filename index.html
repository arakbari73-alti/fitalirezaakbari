<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فیت‌شاه | کالری‌شمار و برنامه فستینگ</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg:#05080f;--card:#0f172a;--elev:#1e293b;--em:#10b981;--glow:rgba(16,185,129,.25);--gold:#fbbf24;--txt:#f8fafc;--mut:#94a3b8;--bd:rgba(255,255,255,.08);--warn:#f97316}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding-bottom:calc(90px + env(safe-area-inset-bottom));overflow-x:hidden}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#10b981,#047857);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.s-logo{width:110px;height:110px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:3.5rem;font-weight:900;color:#047857;margin-bottom:15px}
.s-title{font-size:2rem;font-weight:900;direction:ltr}
.s-sub{font-size:1rem;opacity:.85;font-weight:700}
.navbar{position:sticky;top:0;z-index:100;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.b-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--em),var(--gold));display:flex;align-items:center;justify-content:center;color:#05080f;font-weight:900;font-size:.8rem}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:1.05rem;font-weight:900}
.b-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.95);backdrop-filter:blur(15px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 5px calc(12px + env(safe-area-inset-bottom));z-index:1000}
.bn-item{display:flex;flex-direction:column;align-items:center;color:var(--mut);font-size:.7rem;font-weight:800;gap:4px;flex:1;background:none;border:none;cursor:pointer}
.bn-item .ico{font-size:1.4rem;filter:grayscale(1) opacity(.5)}.bn-item.active{color:var(--em)}.bn-item.active .ico{filter:none;transform:scale(1.15)}
.bn-c{position:relative;top:-18px;display:flex;flex-direction:column;align-items:center}
.bn-c-btn{background:linear-gradient(135deg,var(--em),#047857);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:5px solid var(--bg);color:#fff;font-size:1.8rem}
.drawer-bg{position:fixed;inset:0;background:rgba(5,8,15,.8);z-index:2000;display:none}.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:-320px;width:300px;height:100%;background:var(--card);z-index:2100;padding:20px 16px;display:flex;flex-direction:column;transition:.25s;border-left:1px solid var(--bd);overflow-y:auto;visibility:hidden}.drawer.open{right:0;visibility:visible}
.nav-btn{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--bd);color:#cbd5e1;padding:12px;border-radius:12px;font-weight:800;text-align:right;margin-bottom:8px;cursor:pointer}
.wrapper{max-width:600px;margin:20px auto;padding:0 16px}
.pane{display:none}.pane.active{display:block}
.card{background:var(--card);border-radius:22px;padding:22px 18px;margin-bottom:18px;border:1.5px solid var(--bd)}
.c-head{display:flex;justify-content:space-between;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--bd);font-weight:900;font-size:1.05rem}
